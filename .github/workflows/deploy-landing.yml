name: Deploy landing (GitHub Pages)

# Publikuje landing page Parawana (apps/landing → jeden plik index.html) na GitHub Pages
# pod domeną parawan.karolwilczynski.com. Odpala się przy zmianach w landingu lub w rdzeniu
# (live demo importuje silnik z packages/core), oraz ręcznie z zakładki Actions.
#
# Wymagana jednorazowa konfiguracja w repo: Settings → Pages → Source: „GitHub Actions".
# Domena (CNAME) jest w apps/landing/public/CNAME i trafia do artefaktu przy buildzie.

on:
  push:
    branches: [main]
    paths:
      - 'apps/landing/**'
      - 'packages/core/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nie przerywaj trwającego deployu; kolejkuj po jednym.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Testy landingu żyją w apps/web (landing.test.ts i inne): sprawdzają przykład z demo
      # i przykłady z treści na prawdziwym silniku. Bez nich strona rozjechana z rdzeniem
      # (np. po zmianie reguły w packages/core) poszłaby na produkcję mimo czerwonego CI.
      - run: npm run build -w anonimizator
      - run: npm run test -w anonimizator-web
      - run: npm run build -w parawan-landing
      - name: Strażnik CSP (landing)
        run: |
          grep -Eq "<meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'[^\"]*connect-src 'none'" apps/landing/dist/index.html \
            || { echo "::error::brak Content-Security-Policy z default-src 'none' i connect-src 'none'"; exit 1; }
          node scripts/e2e/csp.mjs landing
          node scripts/e2e/zakazane-api.mjs landing
      # Strona opisuje CSP w pobieranym pliku i notkę „Dla działu IT” w JAK-UZYC.txt. Gdy najnowsze
      # wydanie ich nie ma (strona wyprzedza wydanie), deploy staje: najpierw wydaj nową wersję
      # (tag v*), potem w zakładce Actions „Re-run failed jobs”.
      - name: Najnowsze wydanie zgodne z opisem na stronie
        run: |
          curl -fsSL -o /tmp/Parawan.html https://github.com/karolpolikarp/parawan/releases/latest/download/Parawan.html
          curl -fsSL -o /tmp/JAK-UZYC.txt https://github.com/karolpolikarp/parawan/releases/latest/download/JAK-UZYC.txt
          grep -Eq "<meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'[^\"]*connect-src 'none'" /tmp/Parawan.html \
            || { echo "::error::najnowsze wydanie Parawan.html nie ma CSP opisanej na stronie, najpierw wydaj nową wersję"; exit 1; }
          grep -q "Dla działu IT" /tmp/JAK-UZYC.txt \
            || { echo "::error::najnowsze wydanie JAK-UZYC.txt nie ma notki „Dla działu IT”, najpierw wydaj nową wersję"; exit 1; }
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/landing/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
