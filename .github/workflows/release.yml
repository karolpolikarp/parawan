name: Release

# Tag `v*` (np. v0.46.25) buduje samowystarczalny Parawan.html i publikuje wydanie: plik,
# JAK-UZYC.txt, DLA-IOD-I-IT.txt i SHA256SUMS.txt z opisem z CHANGELOG.md, plus atestację
# pochodzenia pliku (gh attestation verify). Teksty wydania żyją w docs/wydanie/, a wypełnia je
# scripts/release/render-docs.mjs, więc test widzi je przed wydaniem.
#
# Ręczne uruchomienie (gh workflow run release.yml --ref main -f dry_run=true) robi build,
# bramkę i pliki wydania, wypisuje sumy i niczego nie publikuje: kroki atestacji i wydania
# biegną tylko przy tagu. workflow_dispatch działa dla pliku obecnego na gałęzi domyślnej, więc
# przed scaleniem render-docs sprawdzają testy w ci.yml.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Próba: build i pliki wydania bez publikacji'
        type: boolean
        default: true

# id-token i attestations: atestacja pochodzenia (actions/attest-build-provenance).
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # publikacja wyłącznie z tagu; ręczne uruchomienie jest zawsze próbą
      PUBLIKUJ: ${{ startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
      # Node 22 jak job e2e w ci.yml: node --test rozwija wzorzec plików testów dopiero od Node 21.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w anonimizator
      - run: npm run test -w anonimizator
      # Jeden produkt: samowystarczalny HTML, file://, zero instalacji i uruchamiania.
      # Warstwa AI (rzadkie/obce nazwiska) żyje osobno: github.com/karolpolikarp/anonimizator-ai
      - name: Zbuduj aplikację (samowystarczalny HTML)
        run: npm run build -w anonimizator-web
      # Ten sam strażnik CSP co w ci.yml: wydany plik musi blokować połączenia sieciowe.
      - name: Strażnik CSP
        run: |
          grep -Eq "<meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'[^\"]*connect-src 'none'" apps/web/dist/index.html \
            || { echo "::error::brak Content-Security-Policy z default-src 'none' i connect-src 'none'"; exit 1; }
          node scripts/e2e/csp.mjs web
          node scripts/e2e/zakazane-api.mjs web
      # DLA-IOD-I-IT.txt obiecuje, że budowa z tagu daje plik o tej samej sumie. Drugi build
      # z tego samego drzewa musi więc dać identyczne bajty, inaczej obietnica jest pusta.
      - name: Strażnik powtarzalności (drugi build, ta sama suma)
        run: |
          pierwszy="$(sha256sum apps/web/dist/index.html | cut -d' ' -f1)"
          cp apps/web/dist/index.html "$RUNNER_TEMP/pierwszy.html"
          npm run build -w anonimizator-web
          drugi="$(sha256sum apps/web/dist/index.html | cut -d' ' -f1)"
          echo "pierwszy build: $pierwszy"
          echo "drugi build:    $drugi"
          if [ "$pierwszy" != "$drugi" ]; then
            cmp "$RUNNER_TEMP/pierwszy.html" apps/web/dist/index.html | head -5 || true
            echo "::error::build nie jest powtarzalny: dwa buildy z tego samego commita dają różne pliki"
            exit 1
          fi
      # Tag nie czeka na wynik CI, więc wydawany plik sam przechodzi bramkę E2E z ci.yml (sieć,
      # CSP, błędy startu, rozmiar). Landing budowany tylko na potrzeby jej testów, do wydania
      # nie trafia.
      - run: npm run build -w parawan-landing
      - run: npx playwright install --with-deps chromium
      - name: Bramka E2E na wydawanym pliku
        run: npm run e2e
      - name: Zrzuty z nieudanych testów
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-zrzuty
          path: test-results/e2e/
          if-no-files-found: ignore
      # Wersja z apps/web/package.json, data z commita, suma i CSP z gotowego pliku. Przy tagu
      # brak sekcji wersji w CHANGELOG.md albo linii „Pilność:” zatrzymuje wydanie; próba
      # wstawia wtedy zaślepkę.
      - name: Pliki wydania (render-docs)
        run: |
          if [ "$PUBLIKUJ" = "true" ]; then proba=""; else proba="--proba"; fi
          node scripts/release/render-docs.mjs apps/web/dist/index.html wydanie $proba
          cd wydanie && sha256sum -c SHA256SUMS.txt
      - name: Sumy i opis wydania
        run: |
          {
            echo '### Sumy SHA-256'
            echo '```'
            cat wydanie/SHA256SUMS.txt
            echo '```'
            echo
            cat wydanie/release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"
          cat wydanie/SHA256SUMS.txt
      - name: Pliki wydania do pobrania z przebiegu
        uses: actions/upload-artifact@v7
        with:
          name: pliki-wydania
          path: wydanie/
      # Atestacja działa tylko w repozytorium projektu (w forku nie ma do niej uprawnień).
      - name: Atestacja pochodzenia Parawan.html
        if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run && github.repository == 'karolpolikarp/parawan'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: wydanie/Parawan.html
      - name: Wydanie na GitHubie
        if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
        uses: softprops/action-gh-release@v3
        with:
          files: |
            wydanie/Parawan.html
            wydanie/JAK-UZYC.txt
            wydanie/DLA-IOD-I-IT.txt
            wydanie/SHA256SUMS.txt
          body_path: wydanie/release-notes.md
