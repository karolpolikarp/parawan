name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Bramka stylu/jakości statycznej (Biome) — łapie realne błędy (nieużyte zmienne, złe
      # typy) na całym repo. Formatowania NIE wymuszamy repo-wide (świadomie, bez big-bangu).
      - name: Lint (Biome)
        run: npm run lint
      - run: npm run build -w anonimizator
      - run: npm run test -w anonimizator
      - run: npx tsc -p apps/web/tsconfig.json
      - run: npm run test -w anonimizator-web
      - run: npm run build -w anonimizator-web
      # Pliki wydania (JAK-UZYC.txt, DLA-IOD-I-IT.txt, SHA256SUMS.txt, opis) z szablonów
      # w docs/wydanie/. Ręczna próba release.yml działa dopiero po scaleniu na main, więc skrypt
      # sprawdzamy tutaj: testy i przebieg na właśnie zbudowanym pliku (--proba, bo wpis
      # w CHANGELOG nowej wersji powstaje dopiero przed tagiem).
      - name: Pliki wydania (render-docs)
        run: |
          node --test scripts/release/render-docs.test.mjs
          node scripts/release/render-docs.mjs apps/web/dist/index.html "$RUNNER_TEMP/wydanie" --proba
          cd "$RUNNER_TEMP/wydanie" && sha256sum -c SHA256SUMS.txt
      # Landing (parawan.karolwilczynski.com) — typecheck jak w apps/web + build jednoplikowy,
      # żeby strona marketingowa nie zgniła przy zmianach w rdzeniu/silniku (live demo importuje redactPII).
      - run: npx tsc -p apps/landing/tsconfig.json
      - run: npm run build -w parawan-landing
      # Strażnik CSP: oba gotowe pliki muszą nieść politykę z default-src i connect-src 'none'
      # (wstrzykuje ją plugin parawan-csp w vite.config.ts). Bez niej obietnicy „tekst nie
      # opuszcza przeglądarki” pilnowałby tylko nasz kod, a nie przeglądarka.
      # Jeden wzorzec na samym tagu meta: landing cytuje obie dyrektywy w treści („Jak sprawdzić”),
      # więc osobne grepy po całym pliku przeszłyby nawet bez wstrzykniętej polityki.
      # Grep nie widzi hosta dopisanego do img-src, font-src czy script-src, a obrazek z treścią
      # w adresie wysyła dane jak fetch. Dlatego csp.mjs sprawdza każdą dyrektywę osobno.
      - name: Strażnik CSP (web i landing)
        run: |
          for f in apps/web/dist/index.html apps/landing/dist/index.html; do
            grep -Eq "<meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'[^\"]*connect-src 'none'" "$f" \
              || { echo "::error file=$f::brak Content-Security-Policy z default-src 'none' i connect-src 'none'"; exit 1; }
          done
          node scripts/e2e/csp.mjs
      # WebRTC (RTCPeerConnection) CSP nie obejmuje: połączenie UDP wyszłoby mimo default-src
      # 'none'. Ten strażnik odrzuca je w tekście obu plików, razem z sendBeacon, EventSource,
      # WebTransport i workerami (wyjątek: jedno opisane miejsce w pdf.js). Próby w czasie działania
      # łapie bramka E2E.
      - name: Strażnik zakazanych API (web i landing)
        run: node scripts/e2e/zakazane-api.mjs
      # Bramka regresji detekcji na warstwie deterministycznej (bez modelu ONNX — warstwy NER
      # pominięte fail-safe). Fail przy spadku recall na kategoriach osobowych/strukturalnych
      # lub precyzji poniżej progu. Nie commituje raportu — tylko sprawdza progi.
      - name: Bramka benchmarku (rdzeń)
        run: node scripts/benchmark/run.mjs --check

  # Bramka E2E na gotowym pliku: Chromium otwiera dist/index.html aplikacji i landingu przez
  # file://, a każdy test kończy się sprawdzeniem zera żądań poza plikiem, zera naruszeń CSP
  # i zera wyjątków (scripts/e2e). Tu biegnie też dostępność (a11y.test.mjs: axe WCAG 2.1 AA
  # z listą wyjątków, która może tylko maleć, klawiatura, wysoki kontrast, odstępy tekstu,
  # powiększenie 200%). Stare i inne silniki sprawdza osobno zgodnosc.yml, bez blokowania PR.
  # Osobny job na Node 22: Node 20 nie rozwija globów w
  # node --test i nie ma już wsparcia, a job wyżej (z bramką benchmarku) zostaje bez zmian.
  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w anonimizator
      - run: npm run build -w anonimizator-web
      - run: npm run build -w parawan-landing
      - name: Wersja Playwright (klucz cache przeglądarki)
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # Przy trafieniu w cache pobieranie przeglądarki jest pomijane, zostają biblioteki systemowe.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Zrzuty z nieudanych testów
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-zrzuty
          path: test-results/e2e/
          if-no-files-found: ignore
